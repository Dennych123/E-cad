<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23ff7a1a'/%3E%3Cpath d='M2.5 11.5h3l1.5-7 2 9 1.5-5h3' fill='none' stroke='%231c0d02' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- three and the fonts are served from node_modules: the app works offline on factory PCs -->
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="brand-mark" id="brandMark"></span><span>ecad</span></div>
    <button class="btn" id="projectBtn" data-tip="Switch project"><span class="mono" id="projectName">—</span></button>
    <nav class="crumbs" aria-label="Current sheet">
      <span class="chev" id="crumbChev"></span>
      <span class="faint" id="crumbDrawing"></span>
      <span class="chev" id="crumbChev2"></span>
      <span class="sheet-name" id="sheetName" data-tip="Double-click to rename"></span>
      <span class="dirty-dot" id="dirtyDot" hidden title="Unsaved changes"></span>
    </nav>
    <div class="spacer"></div>
    <div class="seg" id="modeSeg" role="tablist" aria-label="Workspace">
      <span class="ind"></span>
      <button role="tab" aria-selected="true" data-mode="2d" id="tab2d"></button>
      <button role="tab" aria-selected="false" data-mode="3d" id="tab3d"></button>
    </div>
    <div class="spacer"></div>
    <div class="row" style="position:relative">
      <input type="search" id="search" placeholder="Search tag, wire, address" aria-label="Search" style="width:220px">
    </div>
    <button class="ibtn" id="langBtn" data-tip="Drawing language" data-keys="Alt+L"></button>
    <button class="ibtn" id="themeBtn" data-tip="Theme"></button>
    <button class="ibtn" id="paletteBtn" data-tip="Commands" data-keys="Ctrl+K"></button>
  </header>

  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Tools"></div>

  <main id="main">
    <aside class="pane left" id="left">
      <div class="tabs" role="tablist" id="leftTabs"><span class="ind"></span>
        <button role="tab" aria-selected="true" data-tab="sheets">Sheets</button>
        <button role="tab" aria-selected="false" data-tab="symbols">Symbols</button>
        <button role="tab" aria-selected="false" data-tab="components">Components</button>
      </div>
      <div class="pane-tools" id="leftTools"></div>
      <div class="pane-body" id="leftBody"></div>
    </aside>
    <section class="stage" id="stage2d" aria-label="Drawing"></section>
    <section class="stage three" id="stage3d" aria-label="3D panel" hidden></section>
    <aside class="pane right" id="right"><div class="pane-body" id="inspector"></div></aside>
  </main>

  <footer class="statusbar" id="status">
    <span class="item mono" id="stCursor">x —  y —</span>
    <span class="item" id="stZoom"></span>
    <span class="item" id="stTool"></span>
    <span class="item" id="stSel"></span>
    <span class="spacer"></span>
    <span class="item" id="stIndex"></span>
    <span class="item" id="stSave"></span>
  </footer>
  <div id="searchResults" class="menu" data-state="closed" hidden style="max-height:60vh;overflow:auto"></div>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
