# title blocks, frames, revision tables, symbol/master names, hazard tables).
# Keys are matched after NFKC normalisation with ALL whitespace removed, so write them any way
# that reads well. Values may contain "\n" for multi-line text.
# Machine-specific phrases belong in projects/<p>/i18n/ja-en.yaml (private), not here.

